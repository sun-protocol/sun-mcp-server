name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Explain optional dependency review
        if: vars.DEPENDENCY_REVIEW_ENABLED != 'true'
        run: |
          echo "Dependency review is disabled because this repository has not opted in."
          echo "Enable Dependency Graph/Code Security, then set DEPENDENCY_REVIEW_ENABLED=true."

      - name: Checkout repository
        if: vars.DEPENDENCY_REVIEW_ENABLED == 'true'
        uses: actions/checkout@v6

      - name: Review dependency changes
        if: vars.DEPENDENCY_REVIEW_ENABLED == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x", "24.x"]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check generated documentation
        run: npm run docs:check

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Verify npm package
        run: npm run test:package

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify reviewed dependency overrides
        run: npm run security:overrides

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Generate production SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > production-sbom.cdx.json

      - name: Upload production SBOM
        uses: actions/upload-artifact@v6
        with:
          name: production-sbom
          path: production-sbom.cdx.json
          if-no-files-found: error

  build-and-push:
    needs: [lint-test, supply-chain]
    if: github.event_name == 'push' && github.ref_type == 'tag' && (startsWith(github.ref_name, 'test-v') || startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || 'sun-protocol/sun-mcp-server' }}
      IMAGE_TAG: ${{ startsWith(github.ref_name, 'test-v') && 'test' || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
